<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종촌중 2학년 · 비상(황) Lesson 5~6 OMR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#2E2A24; --muted:#8A7F70;
  --line:#E6DCCB; --accent:#3D7A5A; --accent-soft:#EAF2ED;
  --wrong:#B23A2E; --wrong-soft:#FBEDEB; --gold:#C9821F;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; padding-bottom:80px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ── 헤더 ── */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:baseline;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.hd h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.02em}
.hd .who{font-size:13px;color:var(--muted);margin-left:auto}
.hd .who input{
  width:88px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);font-size:13px;font-family:inherit;color:var(--ink);font-weight:600
}
.hd .who input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.hd .who span{margin-left:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--muted);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 로그인 ── */
#login{padding:56px 0}
#login h2{font-size:22px;margin:0 0 6px;letter-spacing:-0.02em}
#login p{color:var(--muted);font-size:14px;margin:0 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.field input{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);
  font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)
}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.schools{display:flex;gap:8px}
.schools button{
  flex:1;padding:13px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius);font-size:15px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer
}
.schools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.primary{
  width:100%;padding:15px;border:0;border-radius:var(--radius);background:var(--accent);
  color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px
}
.primary:disabled{background:#CFC7B8;cursor:not-allowed}

/* ── 시험지 ── */
.sheet-head{padding:20px 0 6px}
.sheet-head h2{font-size:20px;margin:0;letter-spacing:-0.02em}
.sheet-head span{font-size:13px;color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.group>h3{
  margin:0;padding:12px 14px;font-size:14px;font-weight:700;
  background:#F4EEE3;border-bottom:1px solid var(--line);letter-spacing:-0.01em
}
.group>h3 em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}

.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #F2EBDE;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.num{width:30px;flex:0 0 30px;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.row.ok .num{color:var(--accent)}
.row.no .num{color:var(--wrong)}

/* 객관식 */
.bubbles{display:flex;gap:6px}
.bubble{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);
  font-size:15px;font-family:inherit;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0
}
.bubble.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
/* 2택 */
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{
  padding:8px 14px;min-height:38px;border:1.5px solid var(--line);background:var(--surface);
  border-radius:999px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer
}
.pick.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.multi{font-size:11px;color:var(--gold);font-weight:700;margin-left:2px}

/* 서술형 */
.rev{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.showbtn{
  padding:7px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;font-weight:600
}
.ans{
  flex:1;min-width:200px;background:var(--accent-soft);border-radius:8px;padding:8px 11px;
  font-size:14px;line-height:1.5;color:#1F4A38;word-break:break-word
}
.ox{display:flex;gap:6px;margin-left:auto}
.ox button{
  width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);
  font-size:16px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;padding:0
}
.ox button.o.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ox button.x.on{background:var(--wrong);border-color:var(--wrong);color:#fff}

/* 결과 */
.actions{display:flex;gap:8px;margin:18px 0 10px}
.actions button{
  flex:1;padding:13px;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer
}
.btn-grade{border:0;background:var(--accent);color:#fff}
.btn-reset{border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.result{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:24px;display:none
}
.result.show{display:block}
.score{font-size:15px;font-weight:700;margin-bottom:8px}
.score b{font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.wronglist{font-size:13px;color:var(--muted);line-height:1.7}
.wronglist b{color:var(--wrong)}
.note{
  background:#FDF6E6;border:1px solid #EFE0BE;border-radius:8px;padding:11px 13px;
  font-size:13px;color:#6B5626;line-height:1.6;margin:12px 0
}
footer{text-align:center;font-size:12px;color:var(--muted);padding:26px 0}
@media (max-width:420px){
  .bubble{width:34px;height:34px;font-size:14px}
  .ox button{width:34px;height:34px}
  .ans{min-width:100%}
  .ox{margin-left:0}
}
</style>
</head>

/* ============ 상태 ============ */
const KEY='bn_omr_m2_L56_v1_jc';
let S = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ return blank(); }
}
function blank(){ return {name:'', school:'', ans:{}, self:{}, seen:{}, graded:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============ 이름(선택) · 학교 고정 ============ */
const SCHOOL='종촌중';
S.school=SCHOOL;
document.getElementById('whoSchool').textContent=SCHOOL;

const nmEl=document.getElementById('whoName');
nmEl.value = S.name || localStorage.getItem('bn_name') || '';
nmEl.oninput=()=>{
  S.name=nmEl.value.trim();
  try{ localStorage.setItem('bn_name',S.name); }catch(e){}
  save();
};

/* ============ 탭 ============ */
let cur=0;
function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  SHEETS.forEach((sh,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':''); b.textContent=sh.tab;
    b.onclick=()=>render(i); t.appendChild(b);
  });
}

/* ============ 렌더 ============ */
function k(sid,gi,n){ return sid+'|'+gi+'|'+n; }

function render(i){
  cur=i;
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===i));
  const sh=SHEETS[i], m=document.getElementById('sheet');
  m.innerHTML='';

  const head=document.createElement('div');
  head.className='sheet-head';
  head.innerHTML='<h2>'+sh.title+'</h2><span>'+sh.sub+'</span>';
  m.appendChild(head);

  const note=document.createElement('div');
  note.className='note';
  note.textContent='객관식은 답을 골라 마킹하고, 서술형은 [정답 보기]를 눌러 내 답과 비교한 뒤 O 또는 X를 직접 누르세요.';
  m.appendChild(note);

  sh.groups.forEach((g,gi)=>{
    const box=document.createElement('div'); box.className='group';
    const h=document.createElement('h3');
    h.innerHTML=g.t+(g.s?'<em>'+g.s+'</em>':'');
    box.appendChild(h);
    g.items.forEach(it=>box.appendChild(rowFor(sh.id,gi,g,it)));
    m.appendChild(box);
  });

  const act=document.createElement('div'); act.className='actions';
  const gb=document.createElement('button'); gb.className='btn-grade'; gb.textContent='채점하기';
  gb.onclick=()=>{ S.graded[sh.id]=1; save(); render(i); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };
  const rb=document.createElement('button'); rb.className='btn-reset'; rb.textContent='다시 풀기';
  rb.onclick=()=>{
    if(!confirm('이 시험지의 답을 모두 지울까요?')) return;
    Object.keys(S.ans).forEach(x=>{ if(x.startsWith(sh.id+'|')) delete S.ans[x]; });
    Object.keys(S.self).forEach(x=>{ if(x.startsWith(sh.id+'|')) delete S.self[x]; });
    Object.keys(S.seen).forEach(x=>{ if(x.startsWith(sh.id+'|')) delete S.seen[x]; });
    delete S.graded[sh.id]; save(); render(i); window.scrollTo({top:0});
  };
  act.appendChild(gb); act.appendChild(rb); m.appendChild(act);

  const res=document.createElement('div'); res.className='result'; res.id='res';
  m.appendChild(res);
  if(S.graded[sh.id]) showResult(sh);
}

function rowFor(sid,gi,g,it){
  const row=document.createElement('div'); row.className='row';
  const key=k(sid,gi,it[0]);
  const n=document.createElement('div'); n.className='num'; n.textContent=it[0];
  row.appendChild(n);

  if(g.type==='mc'){
    const wrap=document.createElement('div'); wrap.className='bubbles';
    const multi=!!it[2];
    for(let v=1;v<=5;v++){
      const b=document.createElement('button'); b.className='bubble';
      b.textContent='①②③④⑤'[v-1];
      const picked=(S.ans[key]||[]).includes(v);
      if(picked) b.classList.add('on');
      b.onclick=()=>{
        let a=S.ans[key]||[];
        if(multi){ a = a.includes(v) ? a.filter(x=>x!==v) : a.concat(v).sort(); }
        else { a = a.includes(v) ? [] : [v]; }
        S.ans[key]=a; save(); render(cur);
      };
      wrap.appendChild(b);
    }
    row.appendChild(wrap);
    if(multi){ const m=document.createElement('span'); m.className='multi'; m.textContent='모두 고르기'; row.appendChild(m); }
    markRow(row,sid,key,graded(sid)?judgeMC(S.ans[key],it[1]):null);
  }

  else if(g.type==='pick'){
    const wrap=document.createElement('div'); wrap.className='picks';
    it[1].forEach((label,idx)=>{
      const b=document.createElement('button'); b.className='pick'; b.textContent=label;
      if((S.ans[key]||[])[0]===idx) b.classList.add('on');
      b.onclick=()=>{ S.ans[key]=((S.ans[key]||[])[0]===idx)?[]:[idx]; save(); render(cur); };
      wrap.appendChild(b);
    });
    row.appendChild(wrap);
    const a=(S.ans[key]||[])[0];
    markRow(row,sid,key, graded(sid) ? (a===undefined?false:a===it[2]) : null);
  }

  else { // rev
    const box=document.createElement('div'); box.className='rev';
    if(S.seen[key]){
      const a=document.createElement('div'); a.className='ans'; a.textContent=it[1];
      box.appendChild(a);
      const ox=document.createElement('div'); ox.className='ox';
      [['O','o'],['X','x']].forEach(([t,c])=>{
        const b=document.createElement('button'); b.className=c+(S.self[key]===t?' on':''); b.textContent=t;
        b.onclick=()=>{ S.self[key]=(S.self[key]===t?'':t); save(); render(cur); };
        ox.appendChild(b);
      });
      box.appendChild(ox);
    } else {
      const b=document.createElement('button'); b.className='showbtn'; b.textContent='정답 보기';
      b.onclick=()=>{ S.seen[key]=1; save(); render(cur); };
      box.appendChild(b);
    }
    row.appendChild(box);
    if(S.self[key]==='O') row.classList.add('ok');
    if(S.self[key]==='X') row.classList.add('no');
  }
  return row;
}

function graded(sid){ return !!S.graded[sid]; }
function judgeMC(a,correct){
  a=a||[];
  if(a.length===0) return false;
  if(a.length!==correct.length) return false;
  return correct.every(v=>a.includes(v));
}
function markRow(row,sid,key,ok){
  if(ok===null) return;
  row.classList.add(ok?'ok':'no');
}

/* ============ 결과 ============ */
function showResult(sh){
  let total=0, right=0, wrong=[];
  sh.groups.forEach((g,gi)=>{
    g.items.forEach(it=>{
      const key=k(sh.id,gi,it[0]); total++;
      let ok=false;
      if(g.type==='mc') ok=judgeMC(S.ans[key],it[1]);
      else if(g.type==='pick') ok=((S.ans[key]||[])[0]===it[2]);
      else ok=(S.self[key]==='O');
      if(ok) right++; else wrong.push(g.t.replace(/ · /g,' ')+' '+it[0]);
    });
  });
  const r=document.getElementById('res'); r.className='result show';
  let html='<div class="score"><b>'+right+'</b> / '+total+' 개 맞았어요</div>';
  if(wrong.length){
    html+='<div class="wronglist"><b>다시 볼 문제</b><br>'+wrong.join(' · ')+'</div>';
  } else {
    html+='<div class="wronglist">전부 맞았습니다. 선생님께 보여주세요.</div>';
  }
  html+='<div class="wronglist" style="margin-top:10px">'+S.school+' '+S.name+'</div>';
  r.innerHTML=html;
}

/* ============ 시작 ============
   모든 선언(let cur 등)이 끝난 뒤에 호출해야 한다.
   위쪽에서 부르면 'cur' 초기화 전 접근으로 화면이 빈다. */
buildTabs(); render(0);
</script>
