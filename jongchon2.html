<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종촌중 2학년 · 2학기 기말 7~8과 OMR</title>
<style>
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#2E2A24; --muted:#8A7F70;
  --line:#E6DCCB; --accent:#3D7A5A; --accent-soft:#EAF2ED;
  --wrong:#B23A2E; --gold:#C9821F; --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px; line-height:1.55; padding-bottom:80px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.hd h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.02em}
.hd .who{font-size:13px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.hd .who input{
  width:88px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);font-size:13px;font-family:inherit;color:var(--ink);font-weight:600
}
.hd .who input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--muted);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  font-family:inherit
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.l8{}
.tab.done::after{content:' ✓';color:var(--gold)}
.tab.on.done::after{color:#fff}

.sheet-head{padding:20px 0 4px}
.sheet-head h2{font-size:20px;margin:0;letter-spacing:-0.02em}
.sheet-head span{font-size:13px;color:var(--muted)}
.note{
  background:#FDF6E6;border:1px solid #EFE0BE;border-radius:8px;padding:11px 13px;
  font-size:13px;color:#6B5626;line-height:1.6;margin:12px 0
}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.group>h3{
  margin:0;padding:12px 14px;font-size:14px;font-weight:700;
  background:#F4EEE3;border-bottom:1px solid var(--line);letter-spacing:-0.01em
}
.group>h3 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}

.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #F2EBDE;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.num{width:30px;flex:0 0 30px;font-size:14px;font-weight:700;color:var(--muted)}
.row.ok .num{color:var(--accent)}
.row.no .num{color:var(--wrong)}

.bubbles{display:flex;gap:6px}
.bubble{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);
  font-size:15px;font-family:inherit;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0
}
.bubble.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

.rev{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.showbtn{
  padding:7px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;font-weight:700
}
.ans{
  flex:1;min-width:200px;background:var(--accent-soft);border-radius:8px;padding:8px 11px;
  font-size:14px;line-height:1.5;color:#1F4A38;word-break:break-word
}
.ox{display:flex;gap:6px;margin-left:auto}
.ox button{
  width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);
  font-size:16px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;padding:0
}
.ox button.o.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ox button.x.on{background:var(--wrong);border-color:var(--wrong);color:#fff}

.actions{display:flex;gap:8px;margin:18px 0 10px}
.actions button{
  flex:1;padding:13px;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer
}
.btn-grade{border:0;background:var(--accent);color:#fff}
.btn-reset{border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.result{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:24px;display:none
}
.result.show{display:block}
.score{font-size:15px;font-weight:700;margin-bottom:8px}
.score b{font-size:26px;color:var(--accent)}
.score .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.wronglist{font-size:13px;color:var(--muted);line-height:1.8}
.wronglist b{color:var(--wrong)}
.stamp{margin-top:10px;font-size:13px;color:var(--muted)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:26px 0}
@media (max-width:420px){
  .bubble{width:34px;height:34px;font-size:14px}
  .ox button{width:34px;height:34px}
  .ans{min-width:100%}
  .ox{margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <h1>종촌중 2학년 · 기말 7~8과</h1>
      <div class="who">
        <input id="nm" type="text" placeholder="이름" autocomplete="off">
        <span>종촌중</span>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<main class="wrap" id="sheet"></main>
<footer>봄날영어수학학원</footer>

<script>
/* 데이터: mc[0]=1번 정답, rev=['번호','정답'] */
const SHEETS=[
{id:'L7R1', tab:'7과 1회', title:'7과 · 내신 대비 1회',
 mc:[3,2,4,1,4,2,4,5,3,3,5,3,5,1,1,5,2,2,5,2,1,4,1,4,3],
 rev:[
  ['26','Baking the bread together makes our community stronger.'],
  ['27','The hawker centers are so popular that they are always full of people.'],
  ['28','It is always good to get together with family.'],
  ['29','(A) Would you like some　(B) that would be great'],
  ['30','(A) get together　(B) spending']
 ]},
{id:'L7R2', tab:'7과 2회', title:'7과 · 내신 대비 2회',
 mc:[3,1,5,2,2,1,3,1,2,1,5,5,4,3,4,4,2,5,4,3,3,2,5,4,1],
 rev:[
  ['26','It is fun to share tables with strangers.'],
  ['27','The flatbread is so big that it covers her shoulder.'],
  ['28','Have you ever been there?'],
  ['29','It is made only from flour, salt, and water.'],
  ['30','(1) to become → becoming　(2) enjoy → to enjoy']
 ]},
{id:'L7R3', tab:'7과 3회', title:'7과 · 내신 대비 3회',
 mc:[4,4,4,1,5,1,4,3,5,5,2,4,1,2,1,2,2,5,3,3,3,5,1,3,2],
 rev:[
  ['26','It is fun to try food from other countries.'],
  ['27','Have you taken a one-day class here before?'],
  ['28','Because they make the bread bigger on special days.'],
  ['29','The paella smelled so good that I wanted to try some.'],
  ['30','(A) likes　(B) strangers']
 ]},
{id:'L7R4', tab:'7과 4회', title:'7과 · 내신 대비 4회',
 mc:[3,5,4,1,4,4,5,1,3,1,3,2,3,2,1,5,2,2,2,5,3,4,1,4,5],
 rev:[
  ['26','It is easy to find something we like at the hawker centers.'],
  ['27',"The bread is so big that we can't make it alone."],
  ['28',"I'd love to make a Vietnamese hat."],
  ['29','It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes.'],
  ['30','(1) what → that　(2) kind → kinds']
 ]},
{id:'L8R1', tab:'8과 1회', title:'8과 · 내신 대비 1회',
 mc:[1,2,1,1,2,5,3,2,5,2,2,3,5,1,1,3,5,4,3,5,4,3,4,4,4],
 rev:[
  ['26','Do you know what the most challenging race in the world is?'],
  ['27','This wild journey is not only exciting but also meaningful.'],
  ['28',"Don't forget to take your library card."],
  ['29','They check their skills in using ropes, reading maps, and giving first aid.'],
  ['30','(1) do the teams find out → the teams find out　(2) go → goes']
 ]},
{id:'L8R2', tab:'8과 2회', title:'8과 · 내신 대비 2회',
 mc:[1,5,4,5,3,3,3,3,5,1,1,5,2,2,1,3,5,4,2,4,2,2,4,4,1],
 rev:[
  ['26','Can you tell me where the first checkpoint is?'],
  ['27','Teams not only walk on rough ground but also row boats on rapid water.'],
  ['28','Is it okay to eat snacks in the library?'],
  ['29','They must not make fires or leave trash behind during the race.'],
  ['30','They find out the course just a day before the race.']
 ]},
{id:'L8R3', tab:'8과 3회', title:'8과 · 내신 대비 3회',
 mc:[2,3,3,2,1,5,2,3,2,5,5,1,4,5,5,4,2,4,1,3,3,1,1,4,4],
 rev:[
  ['26','Do you know how long the race is?'],
  ['27','We need not only maps but also ropes.'],
  ['28',"Don't forget to put on sunscreen."],
  ['29','It must have at least one man and one woman.'],
  ['30','(1) shows → show　(2) checks → check']
 ]},
{id:'L8R4', tab:'8과 4회', title:'8과 · 내신 대비 4회',
 mc:[5,5,4,4,4,1,2,1,1,5,2,3,3,2,3,5,3,2,3,4,1,4,1,2,5],
 rev:[
  ['26','I wonder why the course changed.'],
  ['27','For this race, you need not only strength but also teamwork.'],
  ['28','Is it okay to feed the animals?'],
  ['29','They must not make fires or leave trash behind during the race.'],
  ['30','(A) finishes　(B) first']
 ]}
];

const KEY='bn_omr_m2_final78_jc';
const SCHOOL='종촌중';
let S=load(), cur=0;

function load(){
  try{ const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.ans) return v; }catch(e){}
  return {name:'', ans:{}, self:{}, seen:{}, graded:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const nmEl=document.getElementById('nm');
nmEl.value = S.name || (function(){ try{ return localStorage.getItem('bn_name')||''; }catch(e){ return ''; } })();
nmEl.oninput=()=>{
  S.name=nmEl.value.trim();
  try{ localStorage.setItem('bn_name',S.name); localStorage.setItem('bn_school',SCHOOL); }catch(e){}
  save();
};

function k(sid,n){ return sid+'|'+n; }

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  SHEETS.forEach((sh,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'')+(S.graded[sh.id]?' done':'');
    b.textContent=sh.tab;
    b.onclick=()=>{ render(i); window.scrollTo({top:0}); };
    t.appendChild(b);
  });
}

function render(i){
  cur=i;
  buildTabs();
  const sh=SHEETS[i], m=document.getElementById('sheet');
  m.innerHTML='';

  const head=document.createElement('div');
  head.className='sheet-head';
  head.innerHTML='<h2>'+sh.title+'</h2><span>객관식 1~25번 · 서술형 26~30번</span>';
  m.appendChild(head);

  const note=document.createElement('div');
  note.className='note';
  note.textContent='객관식은 고른 번호를 마킹하세요. 서술형은 [정답 보기]를 눌러 내 답과 비교한 뒤 O 또는 X를 직접 누르면 됩니다.';
  m.appendChild(note);

  /* 객관식 */
  const g1=document.createElement('div'); g1.className='group';
  const h1=document.createElement('h3'); h1.innerHTML='객관식<em>1~25번</em>'; g1.appendChild(h1);
  sh.mc.forEach((correct,idx)=>{
    const n=String(idx+1);
    const row=document.createElement('div'); row.className='row';
    const nd=document.createElement('div'); nd.className='num'; nd.textContent=n; row.appendChild(nd);
    const wrap=document.createElement('div'); wrap.className='bubbles';
    const key=k(sh.id,n);
    for(let v=1;v<=5;v++){
      const b=document.createElement('button'); b.className='bubble';
      b.textContent='①②③④⑤'[v-1];
      if(S.ans[key]===v) b.classList.add('on');
      b.onclick=()=>{ S.ans[key]=(S.ans[key]===v?0:v); save(); render(cur); };
      wrap.appendChild(b);
    }
    row.appendChild(wrap);
    if(S.graded[sh.id]) row.classList.add(S.ans[key]===correct?'ok':'no');
    g1.appendChild(row);
  });
  m.appendChild(g1);

  /* 서술형 */
  const g2=document.createElement('div'); g2.className='group';
  const h2=document.createElement('h3'); h2.innerHTML='서술형<em>26~30번 · 정답 보고 스스로 채점</em>'; g2.appendChild(h2);
  sh.rev.forEach(it=>{
    const key=k(sh.id,it[0]);
    const row=document.createElement('div'); row.className='row';
    const nd=document.createElement('div'); nd.className='num'; nd.textContent=it[0]; row.appendChild(nd);
    const box=document.createElement('div'); box.className='rev';
    if(S.seen[key]){
      const a=document.createElement('div'); a.className='ans'; a.textContent=it[1]; box.appendChild(a);
      const ox=document.createElement('div'); ox.className='ox';
      [['O','o'],['X','x']].forEach(p=>{
        const b=document.createElement('button');
        b.className=p[1]+(S.self[key]===p[0]?' on':''); b.textContent=p[0];
        b.onclick=()=>{ S.self[key]=(S.self[key]===p[0]?'':p[0]); save(); render(cur); };
        ox.appendChild(b);
      });
      box.appendChild(ox);
    } else {
      const b=document.createElement('button'); b.className='showbtn'; b.textContent='정답 보기';
      b.onclick=()=>{ S.seen[key]=1; save(); render(cur); };
      box.appendChild(b);
    }
    row.appendChild(box);
    if(S.self[key]==='O') row.classList.add('ok');
    if(S.self[key]==='X') row.classList.add('no');
    g2.appendChild(row);
  });
  m.appendChild(g2);

  /* 버튼 */
  const act=document.createElement('div'); act.className='actions';
  const gb=document.createElement('button'); gb.className='btn-grade'; gb.textContent='채점하기';
  gb.onclick=()=>{
    S.graded[sh.id]=1; save(); render(cur);
    const r=document.getElementById('res'); if(r) r.scrollIntoView({behavior:'smooth',block:'center'});
  };
  const rb=document.createElement('button'); rb.className='btn-reset'; rb.textContent='다시 풀기';
  rb.onclick=()=>{
    if(!confirm(sh.title+' 답을 모두 지울까요?')) return;
    [S.ans,S.self,S.seen].forEach(o=>{ Object.keys(o).forEach(x=>{ if(x.indexOf(sh.id+'|')===0) delete o[x]; }); });
    delete S.graded[sh.id]; save(); render(cur); window.scrollTo({top:0});
  };
  act.appendChild(gb); act.appendChild(rb); m.appendChild(act);

  const res=document.createElement('div'); res.className='result'; res.id='res'; m.appendChild(res);
  if(S.graded[sh.id]) showResult(sh);
}

function showResult(sh){
  let mcRight=0, mcWrong=[], rvRight=0, rvWrong=[], blank=0;
  sh.mc.forEach((correct,idx)=>{
    const n=String(idx+1), a=S.ans[k(sh.id,n)];
    if(!a) blank++;
    if(a===correct) mcRight++; else mcWrong.push(n);
  });
  sh.rev.forEach(it=>{
    const v=S.self[k(sh.id,it[0])];
    if(v==='O') rvRight++; else rvWrong.push(it[0]);
  });
  const total=sh.mc.length+sh.rev.length, right=mcRight+rvRight;
  const r=document.getElementById('res'); r.className='result show';
  let html='<div class="score"><b>'+right+'</b> / '+total+' 개 정답'
         +'<span class="sub">객관식 '+mcRight+'/'+sh.mc.length+' · 서술형 '+rvRight+'/'+sh.rev.length+'</span></div>';
  if(blank) html+='<div class="wronglist" style="color:var(--gold)">아직 마킹하지 않은 객관식이 '+blank+'개 있어요.</div>';
  if(mcWrong.length) html+='<div class="wronglist"><b>객관식 다시 볼 문제</b>　'+mcWrong.join(' · ')+'</div>';
  if(rvWrong.length) html+='<div class="wronglist"><b>서술형 다시 볼 문제</b>　'+rvWrong.join(' · ')+'</div>';
  if(!mcWrong.length && !rvWrong.length) html+='<div class="wronglist">전부 맞았습니다. 선생님께 보여주세요.</div>';
  html+='<div class="stamp">'+SCHOOL+' '+(S.name||'이름 미입력')+' · '+sh.title+'</div>';
  r.innerHTML=html;
}

render(0);
</script>
</body>
</html>
