<style>

  .hdr{background:linear-gradient(135deg,#4c1d95,#7c3aed,#0ea5e9);color:#fff;padding:16px 16px 12px;text-align:center;box-shadow:0 4px 16px rgba(124,58,237,.3);}

  .hdr p{font-size:.73rem;opacity:.85;margin-top:3px;}

  .tab small{display:block;font-size:.56rem;font-weight:500;opacity:.8;margin-top:1px;}
  .tab.on.k0{color:var(--c1);border-bottom-color:var(--c1);background:var(--c1l);}
  .tab.on.k1{color:var(--c2);border-bottom-color:var(--c2);background:var(--c2l);}
  .tab.on.k2{color:var(--c3);border-bottom-color:var(--c3);background:var(--c3l);}
  .tab.on.k3{color:var(--c4);border-bottom-color:var(--c4);background:var(--c4l);}
  .tab.on.k4{color:var(--c5);border-bottom-color:var(--c5);background:var(--c5l);}

  .wrap{padding:13px 11px 90px;max-width:640px;margin:0 auto;}
  .card{background:#fff;border-radius:13px;padding:14px 13px;box-shadow:0 1px 5px rgba(0,0,0,.07);margin-bottom:11px;}
  .card h3{font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border);}

  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 11px;border:1.5px solid var(--border);border-radius:18px;background:#fff;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .12s;}
  .chip:hover{border-color:#c4b5fd;}
  .chip.on{border-color:var(--c5);color:var(--c5);background:var(--c5l);}
  .chip small{font-weight:500;opacity:.7;}
  .chip.done::after{content:' ✔';color:var(--ok);}

  .cnt{display:flex;gap:6px;}
  .cnt .chip{flex:1;text-align:center;}
  .cnt .chip.on{border-color:var(--c1);color:var(--c1);background:var(--c1l);}

  .startbtn{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(124,58,237,.28);}

  .best b{color:var(--c5);}

  .qtop b{color:var(--text);font-size:.8rem;}

  .spell input.ng{border-color:var(--ng);background:var(--ngl);}
  .spell button{padding:12px 18px;border:none;border-radius:11px;background:var(--c5);color:#fff;font-size:.85rem;font-weight:800;cursor:pointer;font-family:inherit;}

  .fbk.on{display:block;}
  .fbk.ok{background:var(--okl);border:1px solid #86efac;}
  .fbk.ng{background:var(--ngl);border:1px solid #fca5a5;}
  .fbk .ttl{font-weight:800;margin-bottom:4px;}

  .fbk .ln{color:#334155;font-size:.76rem;}

  .nextbtn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:11px;background:#334155;color:#fff;font-size:.85rem;font-weight:800;cursor:pointer;font-family:inherit;}
  .quitbtn{width:100%;margin-top:8px;padding:9px;border:1.5px solid var(--border);border-radius:11px;background:#fff;color:var(--muted);font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;}

  /* result */
  .rtop{text-align:center;padding:6px 0 2px;}
  .remo{font-size:2.7rem;}
  .rttl{font-size:1.05rem;font-weight:800;margin-top:4px;}
  .rsc{font-size:2.2rem;font-weight:900;margin:8px 0;}
  .rsc.s{color:var(--ok);}.rsc.w{color:#d97706;}.rsc.d{color:var(--ng);}
  .rsub{font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  .rbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px;}

  .srch{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:.85rem;font-family:inherit;outline:none;margin-bottom:9px;}

  .empty{font-size:.78rem;color:var(--muted);text-align:center;padding:22px 0;}
  .lstat{font-size:.72rem;color:var(--muted);margin-bottom:8px;}

function pool(){
  let list = range==='all' ? ALL : ALL.filter(x=>x.no===range);
  if(MODES[mode].k==='syn') list=list.filter(x=>x.s);

}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLowerCase().replace(/[^0-9a-z\uac00-\ud7a3\u3131-\u318e+]+/g,' ').replace(/\s+/g,' ').trim();}

  });
}

function start(src){
  const p=src||pool();
  if(p.length<4){alert('단어가 부족해요!');return;}
  Q=shuffle(p).slice(0,Math.min(count,p.length));

function keyOf(x){const k=MODES[mode].k;return k==='mean'?x.m:k==='word'?x.w:k==='syn'?firstSyn(x):x.w;}
function buildOpts(cur){
  const k=MODES[mode].k;
  let src = range==='all'?ALL:ALL.filter(x=>x.no===cur.no);
  if(k==='syn')src=src.filter(x=>x.s);
  if(src.length<8)src=k==='syn'?ALL.filter(x=>x.s):ALL;
  const ans=keyOf(cur), used=new Set([norm(ans)]), out=[ans];
  const cand=shuffle(src);
  for(const x of cand){ if(out.length>=4)break; const v=keyOf(x); if(!v)continue; const nv=norm(v); if(used.has(nv))continue; used.add(nv); out.push(v); }
  return shuffle(out);
}
function question(){
  const cur=Q[qi], k=MODES[mode].k; answered=false;
  const prompt = k==='mean'?cur.w : k==='word'?cur.m : k==='syn'?cur.w : cur.m;
  const sub = k==='mean'?('지문 '+cur.no+'번') : k==='word'?('지문 '+cur.no+'번') : k==='syn'?(cur.m+' · 지문 '+cur.no+'번') : ('지문 '+cur.no+'번 · '+(cur.w.split(' ').length>1?cur.w.split(' ').length+'단어':cur.w.length+'글자'));
  const ask = k==='mean'?'우리말 뜻은?' : k==='word'?'알맞은 영어 단어는?' : k==='syn'?'유의어는?' : '영어로 써 보세요';
  let body;
  if(k==='spell'){
    body='<div class="spell"><input id="si" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"><button onclick="checkSpell()">확인</button></div>';
  } else {
    const opts=buildOpts(cur);
    body='<div class="opts">'+opts.map((o,i)=>'<button class="opt" id="o'+i+'" onclick="pick('+i+',this)" data-v="'+esc(o)+'"><span class="on">'+'①②③④'[i]+'</span>'+esc(o)+'</button>').join('')+'</div>';
  }

   +'<div class="qtop"><span>문항 <b>'+(qi+1)+'</b> / '+Q.length+'</span><span>정답 <b>'+score+'</b>개</span></div>'

   +'<div class="qask">'+ask+'</div>'
   +'<div class="qword'+(k==='word'||k==='spell'?' ko':'')+'">'+esc(prompt)+'</div>'
   +'<div class="qsub">'+esc(sub)+'</div>'
   +body
   +'<div class="fbk" id="fbk"></div>'
   +'<button class="nextbtn" id="nx" style="display:none" onclick="next()">다음 문항 →</button>'
   +'</div>'
   +'<button class="quitbtn" onclick="if(confirm(\'퀴즈를 그만두고 처음으로 돌아갈까요?\'))home()">그만두기</button>';
  const si=document.getElementById('si');
  if(si){ si.focus(); si.onkeydown=e=>{ if(e.key==='Enter'){ answered?next():checkSpell(); } }; }

function feedback(ok,cur){
  const f=document.getElementById('fbk');
  let ln='<div class="ln"><b>단어</b>'+esc(cur.w)+' — '+esc(cur.m)+'</div>';
  if(cur.s)ln+='<div class="ln"><b>유의어</b>'+esc(cur.s)+'</div>';
  if(cur.a)ln+='<div class="ln an"><b>반의어</b>'+esc(cur.a)+'</div>';
  f.className='fbk on '+(ok?'ok':'ng');
  f.innerHTML='<div class="ttl">'+(ok?'⭕ 정답이에요!':'❌ 정답은 '+esc(keyOf(cur)))+'</div>'+ln;
  document.getElementById('nx').style.display='block';
  document.getElementById('nx').textContent = qi+1<Q.length?'다음 문항 →':'📊 결과 보기';

function mark(ok,cur){
  answered=true;
  if(ok){score++;noteDel(cur.id);}else{wrongs.push(cur);noteAdd(cur.id);}
  feedback(ok,cur);
}
function pick(i,btn){
  if(answered)return;
  const cur=Q[qi], ans=keyOf(cur), ok=norm(btn.dataset.v)===norm(ans);
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(norm(b.dataset.v)===norm(ans))b.classList.add('ok'); });
  if(!ok)btn.classList.add('ng');
  mark(ok,cur);
}
function checkSpell(){
  if(answered)return;
  const si=document.getElementById('si'), cur=Q[qi];
  if(!si.value.trim()){si.focus();return;}
  const ok=norm(si.value)===norm(cur.w);
  si.disabled=true; si.classList.add(ok?'ok':'ng');
  mark(ok,cur);
}
function next(){ if(qi+1<Q.length){qi++;question();} else result(); }

function result(){
  const t=Q.length, pct=Math.round(score/t*100);
  const best=getJ(bestKey(),null);
  if(!best||pct>best.pct)setJ(bestKey(),{pct:pct,c:score,t:t});
  const emo=pct>=90?'🏆':pct>=70?'😊':pct>=50?'🤔':'😅';
  const ttl=pct>=90?'훌륭해요!':pct>=70?'잘했어요!':pct>=50?'조금 더 노력해요!':'다시 도전해봐요!';
  const cls=pct>=70?'s':pct>=50?'w':'d';
  let wl='';
  if(wrongs.length){
    wl='<div class="card"><h3>❌ 틀린 단어 '+wrongs.length+'개</h3>'+wrongs.map(x=>row(x,false)).join('')+'</div>';
  }
  document.getElementById('wrap').innerHTML=
    '<div class="card"><div class="rtop"><div class="remo">'+emo+'</div><div class="rttl">'+ttl+'</div>'
   +'<div class="rsc '+cls+'">'+score+' / '+t+'</div>'
   +'<div class="rsub">정답률 '+pct+'% · '+MODES[mode].t+' · '+(range==='all'?'전체':range+'번')+'</div>'
   +(best?'<div class="rsub">이전 최고 기록 '+best.pct+'%</div>':'')+'</div>'
   +'<div class="rbtns">'
   +(wrongs.length?'<button class="rb a" onclick="retryWrong()">🔁 틀린 단어만 다시 풀기 ('+wrongs.length+')</button>':'')
   +'<button class="rb b" onclick="start()">🚀 같은 범위 다시 풀기</button>'
   +'<button class="rb c" onclick="home()">📖 범위 · 모드 바꾸기</button>'
   +'</div></div>'+wl;
  window.scrollTo(0,0);
}
function retryWrong(){ const w=wrongs.slice(); count=Math.max(4,w.length); if(w.length<4){ start(w.concat(shuffle(pool()).slice(0,4-w.length))); } else start(w); }

function row(x,star){
  return '<div class="wrow">'+(star?'<span class="wstar">⭐</span>':'')
   +'<div class="wen">'+esc(x.w)+'</div><div class="wko">'+esc(x.m)+'</div>'
   +((x.s||x.a)?'<div class="wsa">'+(x.s?'<b>유</b>'+esc(x.s):'')+(x.s&&x.a?' <span style="opacity:.4">|</span> ':'')+(x.a?'<span class="an"><b>반</b>'+esc(x.a)+'</span>':'')+'</div>':'')
   +'</div>';
}
let lq='', lnote=false, lrange='all';
function wordList(){
  const note=noteGet();
  let list = lnote ? ALL.filter(x=>note[x.id]) : (lrange==='all'?ALL:ALL.filter(x=>x.no===lrange));
  const q=lq.trim().toLowerCase();
  if(q)list=list.filter(x=>x.w.toLowerCase().includes(q)||x.m.includes(lq.trim())||(x.s&&x.s.toLowerCase().includes(q)));
  let chips='<button class="chip'+(!lnote&&lrange==='all'?' on':'')+'" onclick="lset(\'all\')">전체 <small>'+ALL.length+'</small></button>'
   +'<button class="chip'+(lnote?' on':'')+'" onclick="lnoteOn()">⭐ 오답노트 <small>'+Object.keys(note).length+'</small></button>';
  DATA.forEach(g=>{ chips+='<button class="chip'+(!lnote&&lrange===g.no?' on':'')+'" onclick="lset(\''+g.no+'\')">'+esc(g.no)+'번 <small>'+g.w.length+'</small></button>'; });
  document.getElementById('wrap').innerHTML=
    '<div class="card"><h3>📖 지문 번호</h3><div class="chips">'+chips+'</div></div>'
   +'<div class="card"><input class="srch" id="sq" placeholder="🔍 영어 단어 · 우리말 뜻 검색" value="'+esc(lq)+'">'
   +'<div class="lstat">'+list.length+'개 단어'+(lnote?' · 오답노트':'')+'</div>'
   +(list.length?list.map(x=>row(x,!!note[x.id])).join(''):'<div class="empty">'+(lnote?'오답노트가 비어 있어요. 퀴즈를 풀어보세요!':'검색 결과가 없어요')+'</div>')
   +'</div>'
   +(lnote&&list.length>=4?'<button class="startbtn" onclick="quizNote()">🚀 오답노트로 퀴즈 풀기 ('+list.length+'문항)</button>':'');
  const sq=document.getElementById('sq');
  if(sq){ sq.oninput=()=>{ lq=sq.value; const p=sq.selectionStart; wordList(); const s2=document.getElementById('sq'); s2.focus(); s2.setSelectionRange(p,p); }; }
}
function lset(r){lnote=false;lrange=r;wordList();}
function lnoteOn(){lnote=true;wordList();}
function quizNote(){
  const note=noteGet(); const list=ALL.filter(x=>note[x.id]);
  mode=modeIdx('mean'); renderTabs(); count=list.length; start(list);
}
try{ renderTabs(); home(); }
catch(e){
  document.getElementById('wrap').innerHTML='<div class="card"><h3>⚠️ 화면을 그리지 못했어요</h3>'
   +'<div class="hint">사용 중인 브라우저가 오래된 버전일 수 있어요. 크롬 최신 버전이나 다른 기기에서 열어 주세요.<br><br>오류: '+esc(e && e.message)+'</div></div>';
}
</script>
</body>
</html>
